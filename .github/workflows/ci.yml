name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repository. Anything that
# needs more (releases, pages) lives in its own workflow.
permissions:
  contents: read

# A push to a PR branch cancels its own superseded run; runs on main are not
# cancelled so the commit that landed always has a completed result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LLVM_VERSION: 23
  LLVM_SCRIPT_SHA256: 03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with docker/dev.Dockerfile. TODO before release: pin
      # llvm.sh by checksum to close the supply-chain gap.
      - name: Install LLVM
        run: |
          wget -q https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
          echo "$LLVM_SCRIPT_SHA256  /tmp/llvm.sh" | sha256sum -c -
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_VERSION"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build "clang-$LLVM_VERSION" "llvm-$LLVM_VERSION" \
            "llvm-$LLVM_VERSION-dev" "llvm-$LLVM_VERSION-tools" \
            "clang-format-$LLVM_VERSION" "libclang-rt-$LLVM_VERSION-dev" \
            libseccomp2

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DLLVM_DIR="$(llvm-config-$LLVM_VERSION --cmakedir)" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Smoke test (aegis-audit)
        run: |
          clang++-23 -O0 -S -emit-llvm examples/demo.cpp -o build/demo.ll
          opt-23 -load-pass-plugin=build/lib/AegisPass.so -passes=aegis-audit \
            -disable-output build/demo.ll 2> build/audit.log
          cat build/audit.log
          grep -q "\[aegis-audit\] module:" build/audit.log
          grep -q "function=.*_Z15transform_valuei" build/audit.log
          grep -q "\[aegis-audit\] total:" build/audit.log

      - name: Smoke test (decoy pipeline)
        run: |
          # Frontend IR: the transform must see the module before inlining.
          clang++-23 -O2 -Xclang -disable-llvm-passes -S -emit-llvm \
            examples/demo.cpp -o build/demo.frontend.ll
          opt-23 -load-pass-plugin=build/lib/AegisPass.so \
            -passes='aegis-policy<policy=examples/aegis-policy.json>,aegis-decoys,default<O2>,aegis-verify' \
            build/demo.frontend.ll -S -o build/demo.protected.ll 2> build/decoy.log
          cat build/decoy.log
          grep -q "\[aegis-verify\] OK" build/decoy.log
          grep -q "load volatile i32, ptr @__aegis.guard" build/demo.protected.ll

      - name: Smoke test (control-flow pipeline)
        run: |
          # Level 3 must survive the optimizer and the gate, not just build.
          sed 's/"level": 1/"level": 3/' examples/aegis-policy.json > build/level3.json
          opt-23 -load-pass-plugin=build/lib/AegisPass.so \
            -passes='aegis-policy<policy=build/level3.json>,aegis-decoys,aegis-cff,default<O2>,aegis-verify' \
            build/demo.frontend.ll -S -o build/demo.cff.ll 2> build/cff.log
          cat build/cff.log
          grep -q "\[aegis-verify\] OK" build/cff.log
          grep -q "switch i32 %aegis.keyed" build/demo.cff.ll
          grep -q "load volatile i32, ptr %aegis.state" build/demo.cff.ll

      - name: Smoke test (policy lint)
        run: |
          opt-23 -load-pass-plugin=build/lib/AegisPass.so \
            -passes='aegis-policy<policy=examples/aegis-policy.json>,aegis-lint' \
            -disable-output build/demo.frontend.ll 2> build/lint.log
          cat build/lint.log
          grep -q "\[aegis-lint\] summary:" build/lint.log
          grep -q "eligible=yes" build/lint.log
          grep -q "advisory=protect-and-measure" build/lint.log

      # Fail-closed behaviour must be tested, not assumed: a protected build
      # whose decoys were skipped has to break, not warn.
      - name: Smoke test (verify gate fails closed)
        run: |
          if opt-23 -load-pass-plugin=build/lib/AegisPass.so \
              -passes='aegis-policy<policy=examples/aegis-policy.json>,default<O2>,aegis-verify' \
              build/demo.frontend.ll -disable-output 2> build/gate.log; then
            echo "verify gate passed a build it should have rejected" >&2
            exit 1
          fi
          grep -q "protection degraded" build/gate.log

      - name: Bench task integrity
        run: |
          # Manifests pin a content hash; a task edited without re-hashing
          # must fail here rather than produce an unattributable result.
          cd tools/aegis-bench
          python3 -m aegis_bench check --tasks-root ../../benchmarks/tasks-public

      - name: Python sanity
        run: |
          python3 -m compileall -q tools/aegis-bench/aegis_bench \
            tools/aegis-bench/tests tests/differential/run.py \
            tests/external/run_tiny_aes.py tests/container/run_smoke.py \
            scripts/generate-sbom.py

      - name: Format check
        run: |
          clang-format-23 --dry-run -Werror \
            lib/*.cpp lib/*.h include/aegis/*.h \
            tests/differential/fixtures/*.cpp tests/differential/fixtures/*.h \
            tests/differential/suites/representative/*.cpp \
            tests/differential/suites/representative/*.h \
            tests/decoys/fixtures/*.cpp \
            tests/controlflow/fixtures/*.cpp

      # Repository hygiene: no private material, no large binaries, no
      # credentials. A benchmark repo that accidentally ships hidden answers
      # or a key is worse than one that fails a build.
      - name: Repository hygiene
        run: |
          fail=0
          if git ls-files | grep -Eq '(^|/)(tasks-private|\.env|id_rsa|id_ed25519)(/|$)'; then
            echo "private material is tracked" >&2; fail=1
          fi
          if git ls-files -z | xargs -0 -r ls -l 2>/dev/null \
              | awk '$5 > 1048576 { print "large file:", $9; bad=1 } END { exit bad }'; then
            :
          else
            echo "large tracked files found (limit 1 MiB; release artifacts belong elsewhere)" >&2
            fail=1
          fi
          if git grep -nIE "(AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" \
              -- . ':!docs/threat-model.md'; then
            echo "possible credential committed" >&2; fail=1
          fi
          exit $fail

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-report-${{ github.sha }}
          path: |
            build/differential-report.json
            build/representative-differential-report.json
            build/scorecard/scorecard.json
            build/scorecard/scorecard.md
            build/scorecard-representative/scorecard.json
            build/scorecard-representative/scorecard.md
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 30

  container-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned runtime image
        run: docker build -t aegis-ir-dev docker/

      - name: Container-per-cell smoke
        run: |
          python3 tests/container/run_smoke.py \
            --runtime docker --image aegis-ir-dev --user 65534:65534

      - name: Plugin ASan and UBSan
        run: |
          docker run --rm --cap-add SYS_ADMIN --cap-add NET_ADMIN \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            aegis-ir-dev bash -lc 'scripts/sanitizer-check.sh'

      - name: Policy parser fuzzing
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e AEGIS_FUZZ_RUNS=2000 \
            aegis-ir-dev bash -lc 'scripts/fuzz-policy.sh'
